{% extends 'base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'style.css' %}">

<div class="auth-container">
    <div class="form-card">
        <h2 class="form-title" style="color: #2980b9;">Register</h2> 
        <form method="POST">
            {% csrf_token %}
            
            {% for field in form %}
                <div class="form-group">
                    <label>{{ field.label }}</label>
                    {{ field }}
                    
                    {% if field.errors %}
                        {% for error in field.errors %}
                            <p class="error-text">{{ error }}</p>
                        {% endfor %}
                    {% endif %}
                </div>
            {% endfor %}
            
            <button type="submit" class="btn-blue">Register</button>
        </form>
        <p class="form-footer">Already have an account? <a href="{% url 'login' %}">Login Here</a></p>
    </div>
</div>
{% endblock %}
